name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck

  deploy:
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
    steps:
      - name: Skip if secrets not configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Skipping deploy - CLOUDFLARE_API_TOKEN not configured"
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''
      - name: Setup wrangler.toml
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          cp wrangler.toml.example wrangler.toml
          sed -i 's/# \[\[kv_namespaces\]\]/[[kv_namespaces]]/' wrangler.toml
          sed -i 's/# binding = "KV"/binding = "KV"/' wrangler.toml
          sed -i "s/# id = \"your-kv-namespace-id\"/id = \"$KV_NAMESPACE_ID\"/" wrangler.toml
      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
